name: Build & Publish

# Triggers on every push to main and on version tags (e.g. v1.2.3).
#
# This workflow gates *publishing*, not merging, and it cannot gate merging: it
# must never gain a pull_request trigger (see the security note on the deploy
# job below). The merge gate is test.yml — "PR Gate" — which runs the same lint
# and build commands on a hosted runner and is what the required status checks
# on main point at.
#
# The lint/build/test jobs here are therefore not redundant with that workflow.
# They still guard the tag builds and any direct push to main that bypasses a
# pull request, which is the only path by which unchecked code could reach the
# published image.
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  lint:
    runs-on: ubuntu-latest
    # Explicitly limit token permissions — lint only needs read access
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Cache node_modules keyed on package-lock.json — skip npm ci on exact hit.
      # Saves ~18 s on every commit that doesn't touch dependencies.
      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Run TypeScript check and ESLint in parallel — saves ~7 s.
      # Both PIDs are captured; script waits for both and exits non-zero if either fails.
      - name: Typecheck & Lint (parallel)
        run: |
          npx tsc --noEmit & PID_TSC=$!
          npm run lint      & PID_LINT=$!
          CODE=0
          wait $PID_TSC  || CODE=$?
          wait $PID_LINT || CODE=$((CODE + $?))
          exit $CODE

  test:
    needs: []
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: momo
          POSTGRES_PASSWORD: password
          POSTGRES_DB: momo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://momo:password@localhost:5432/momo_test
        run: npm test

  # Build each platform natively in parallel to avoid slow QEMU emulation.
  # amd64 runs on a standard GitHub-hosted runner, arm64 on a native ARM runner.
  # Each job pushes the image by digest (no tag) to GHCR as a staging area,
  # then exports the digest as an artifact for the merge job.
  #
  # Lint runs in parallel with the build to avoid the ~1.5 min wait.
  # The merge job requires both lint and build to succeed before tagging.
  build:
    needs: []
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Derive a safe artifact/cache suffix from the platform name (e.g. linux-amd64)
      - name: Prepare platform suffix
        id: platform
        run: echo "suffix=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate with GitHub Container Registry — used as staging area for digests
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI labels (e.g. org.opencontainers.image.*) are attached at build time
      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jp1337/momo

      # Build a single-platform image and push it by digest (no tag yet).
      # GHA cache is scoped per platform so the layers don't mix.
      #
      # NEXT_PUBLIC_APP_URL is forwarded as a build-arg so that the pre-rendered
      # HTML (Open Graph tags, JSON-LD, canonical URLs) carries the canonical
      # public URL of the published instance rather than localhost. Override
      # via the repository variable `NEXT_PUBLIC_APP_URL` if you fork Momo.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://momotask.app' }}
            MOMO_COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/jp1337/momo,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.suffix }}

      # Write an empty file named after the digest (without the "sha256:" prefix)
      # so the merge job can reconstruct the full digest reference.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  # After both platform builds succeed, pull the two digests from GHCR and
  # create a multi-arch manifest list with proper semver/branch/sha tags
  # in all three registries. All three registry pushes run in parallel to
  # cut the merge step from ~30 s to ~10 s.
  merge:
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Map secrets to env vars — secrets context is not available in step `if` expressions,
    # but env context is. This is the only supported way to conditionally skip steps
    # based on whether a secret is configured.
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

    steps:
      # Download both digest artifacts into the same directory
      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Generate the final tags for all three registries
      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/jp1337/momo
            docker.io/kermit1337/momo
            quay.io/jp1337/momo
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay.io
        if: env.QUAY_TOKEN != ''
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # Push all three manifests in parallel — each registry push is independent.
      # GHCR always runs; DockerHub/Quay only when credentials are set.
      # Background PIDs are captured; the step fails if any push fails.
      - name: Push manifests to all registries (parallel)
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          push_ghcr() {
            # shellcheck disable=SC2046
            docker buildx imagetools create \
              $(jq -cr '.tags | map(select(startswith("ghcr.io")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              $(printf 'ghcr.io/jp1337/momo@sha256:%s ' *)
          }

          push_dockerhub() {
            [[ -z "${DOCKERHUB_TOKEN:-}" ]] && return 0
            # shellcheck disable=SC2046
            docker buildx imagetools create \
              $(jq -cr '.tags | map(select(startswith("docker.io")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              $(printf 'ghcr.io/jp1337/momo@sha256:%s ' *)
          }

          push_quay() {
            [[ -z "${QUAY_TOKEN:-}" ]] && return 0
            # shellcheck disable=SC2046
            docker buildx imagetools create \
              $(jq -cr '.tags | map(select(startswith("quay.io")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              $(printf 'ghcr.io/jp1337/momo@sha256:%s ' *)
          }

          push_ghcr     & PID_GHCR=$!
          push_dockerhub & PID_DH=$!
          push_quay      & PID_QUAY=$!

          CODE=0
          wait $PID_GHCR || CODE=$?
          wait $PID_DH   || CODE=$((CODE + $?))
          wait $PID_QUAY || CODE=$((CODE + $?))
          exit $CODE

  # After the multi-arch manifest is published, trigger an immediate Watchtower update
  # on the intranet server so the new image is rolled out.
  #
  # Runs on RELEASE TAGS only, not on main-branch pushes. The instance tracks the
  # minor series tag (ghcr.io/jp1337/momo:0.7, set as docker_momo_version in the
  # wdk-ansible repo), which the metadata step below publishes from a v* tag —
  # a plain push to main moves :latest and :sha-… and nothing the instance follows.
  # Firing this job there would poll for a swap that was never going to happen.
  #
  # Until 2026-08-28 the job ran on main and the POST was a no-op with HTTP 200:
  # Watchtower on that host is label-scoped and the momo container carried no
  # com.centurylinklabs.watchtower.enable label, so every request was accepted and
  # nothing was swapped. The label now exists (wdk-ansible#64) — which is what makes
  # this job meaningful rather than decorative.
  #
  # ⚠️ SECURITY: this repo is public and this job runs on a self-hosted runner.
  # The whole workflow only triggers on push:main/tags (direct push only — merges
  # are now gated by branch protection). NEVER add a `pull_request` or
  # `pull_request_target` trigger to this workflow, or to any job that runs on
  # `self-hosted` — that turns any fork PR into arbitrary code execution on the
  # intranet runner. Splitting the deploy job into its own workflow would not
  # make it safe either; the trigger is the hazard, not the file boundary.
  #
  # If you came here to make lint or build run on pull requests: they already do,
  # in test.yml ("PR Gate"), on a hosted runner. Add the check there, not here.
  deploy:
    needs: [merge]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, intranet]
    permissions: {}
    # Job-scoped only — never at workflow level: cancelling `build` or
    # `merge` mid-manifest-push would be worse than a stale rollout gate.
    # Two releases cut in quick succession would otherwise leave the older
    # run polling for a commit the instance has already moved past, burning
    # its full ten minutes and failing on a rollout that in fact worked.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Trigger Watchtower update
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_API_TOKEN }}" \
            "http://watchtower:8085/v1/update?image=ghcr.io/jp1337/momo"

      # Watchtower antwortet mit 200, sobald es die Anfrage angenommen hat —
      # nicht, wenn der Container tatsaechlich getauscht ist. Ohne diesen
      # Schritt ist "deploy: success" eine Aussage ueber einen HTTP-Status,
      # nicht ueber den Rollout. Genau so lief es bis zum 2026-08-28: jeder
      # POST wurde angenommen, und live stand weiter 0.6.0.
      #
      # Verglichen wird der COMMIT, nicht die package.json-Version. Seit der
      # Job auf Release-Tags laeuft, wuerde `version` zwar unterscheiden —
      # `commit` ist trotzdem schaerfer: es erkennt auch ein neu gebautes
      # Image unter derselben Version (Tag geloescht und neu gesetzt), wo ein
      # Versionsvergleich sofort gruen waere. github.sha wird als MOMO_COMMIT
      # ins Image gebacken (siehe Dockerfile, runner-Stufe) und vom laufenden
      # Prozess ueber /api/health.commit ausgegeben.
      #
      # Dieser Job laeuft auf dem self-hosted Intranet-Runner (siehe oben) —
      # ob der die oeffentliche URL erreicht, ist nicht garantiert. Deshalb
      # zuerst ROLLOUT_HEALTH_URL (Repository-Variable), dann
      # NEXT_PUBLIC_APP_URL, erst dann der oeffentliche Fallback. Ist der
      # Intranet-Runner vom Zugriff auf momotask.app abgeschnitten, setze
      # ROLLOUT_HEALTH_URL auf die intern erreichbare Adresse derselben
      # Instanz (z. B. http://momo:3000 oder eine interne DNS-Adresse) —
      # unter "Settings" -> "Secrets and variables" -> "Actions" ->
      # "Variables".
      #
      # WICHTIG: Der Wert MUSS das Schema tragen. Stand die Variable auf
      # "momotask.app", faellt curl auf http zurueck, nginx antwortet mit
      # einer 301-HTML-Seite, `sed` findet kein commit — und der Schritt
      # laeuft in seine vollen zehn Minuten, egal wie sauber der Rollout war.
      #
      # Der Schritt bleibt blockierend: ein Verifikationsschritt,
      # der bei Netzwerkproblemen durchfaellt, ist kein Verifikationsschritt
      # mehr, wenn man ihn deshalb ignoriert.
      - name: Verify the rollout actually happened
        env:
          APP_URL: ${{ vars.ROLLOUT_HEALTH_URL || vars.NEXT_PUBLIC_APP_URL || 'https://momotask.app' }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          # ${APP_URL%/} strips a trailing slash — otherwise a
          # ROLLOUT_HEALTH_URL set with one produces "…//api/health".
          url="${APP_URL%/}"
          for attempt in $(seq 1 30); do
            # No `-f`: this gate asks "was the container swapped?", not "is
            # the app healthy?" — a 503 whose body carries a matching commit
            # means the swap happened; a DB outage is a different watchdog's
            # alarm. `-f` would make curl print nothing and exit 22 on that
            # 503, so the commit never reaches sed and the loop misreads a
            # healthy rollout as a stuck one. Without `-f`, the `sed` match
            # itself is the validity check: a proxy error page (e.g. HTML
            # 502) yields no match, `got` stays empty, and the loop retries.
            # --max-time 10 bounds a hung connection so one bad attempt
            # cannot stall the whole gate.
            # The `|| echo '?'` neutralises `set -e` for this one command:
            # a transient curl failure must retry, not abort the job.
            got="$(curl -s --max-time 10 "$url/api/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || echo '?')"
            if [ "$got" = "$EXPECTED" ]; then
              echo "Rollout bestaetigt nach ${attempt} Versuch(en): $got"
              exit 0
            fi
            echo "Versuch $attempt: laeuft Commit $got, erwartet $EXPECTED"
            if [ "$attempt" -lt 30 ]; then
              sleep 20
            fi
          done
          echo "Rollout nicht bestaetigt: /api/health meldet weiter einen anderen Commit."
          echo "Watchtower hat die Anfrage angenommen, den Container aber nicht getauscht."
          exit 1
