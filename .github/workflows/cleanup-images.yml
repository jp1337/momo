name: Cleanup Old Images

# Runs weekly to prevent unbounded growth of sha- tagged images across all
# three container registries. Keeps the 10 most recent sha- tags everywhere;
# semver tags and `latest` are never deleted.
on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly, Sunday 03:00 UTC
  workflow_dispatch:

# Default to the most restrictive permission set for the workflow.
# Individual jobs grant exactly what they need (cleanup-ghcr needs
# packages: write to delete package versions; cleanup-registries
# only talks to external Docker Hub and Quay.io APIs and needs nothing
# from GitHub).
permissions:
  contents: read

jobs:
  # ── GHCR ──────────────────────────────────────────────────────────────────
  # Keeps only the 10 most recent manifest lists that carry nothing but sha-
  # tags; semver tags and `latest` are never candidates.
  #
  # There used to be a step 1 deleting every UNTAGGED version. On GHCR the
  # per-platform manifests of a multi-arch tag are exactly such untagged
  # versions, so it deleted the images behind every tag: on 2026-10-25 the
  # index of `0.10` (pinned on root01xvp) answered 200 while all four of its
  # platform manifests were 404, so a pull failed with "manifest unknown".
  # Same defect as openwhistle's cleanup in September (openwhistle#70).
  # Do not bring it back.
  cleanup-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Deliberately NOT actions/delete-package-versions: its `ignore-versions`
      # regex is tested against the version *name*, which for container packages
      # is the sha256 digest, never the tags (src/delete.ts: `info.version`,
      # populated from `version.name` in src/version/get-versions.ts). No tag can
      # be protected by it. Until 2026-08-30 this step therefore kept the 10
      # newest versions by age and deleted every semver tag behind them: `0.8`
      # and `0.8.0` were published correctly on 2026-08-28 and gone two days
      # later, so `docker_momo_version: "0.8"` in wdk-ansible 404ed on every
      # deploy of root01xvp. `latest` and the recent `sha-` tags only survived
      # because they sit on the newest versions.
      #
      # The shell version selects by TAG, like the Docker Hub and Quay.io steps
      # below: a version is a candidate only if every tag it carries starts with
      # `sha-`. A version tagged `0.8`, `0.8.0` or `latest` is never selected,
      # however old it is — age decides only among candidates.
      - name: Keep only 10 most recent sha- versions in GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KEEP=10

          # The API returns versions newest-first, so `tail -n +11` is
          # "everything past the 10 most recent candidates".
          mapfile -t VICTIMS < <(
            gh api --paginate \
              "users/jp1337/packages/container/momo/versions?per_page=100" \
              --jq '.[]
                    | select(.metadata.container.tags
                             | length > 0 and all(startswith("sha-")))
                    | "\(.id) \(.metadata.container.tags | join(","))"' \
              | tail -n +$((KEEP + 1))
          )

          DELETED=0
          for v in "${VICTIMS[@]}"; do
            id="${v%% *}"
            if gh api -X DELETE \
              "users/jp1337/packages/container/momo/versions/${id}" --silent; then
              echo "Deleted GHCR: ${v#* } (version ${id})"
              DELETED=$((DELETED + 1))
            else
              echo "Failed to delete GHCR version ${id} (${v#* })" >&2
            fi
          done
          echo "GHCR: kept ${KEEP}, deleted ${DELETED} sha- version(s)."

  # Proves the cleanup left every release pullable. The index of a tag can
  # answer 200 while its platform manifests are gone — that is exactly how
  # 0.10 broke on 2026-10-25 — so every child manifest is fetched one by one.
  # A check right after the release push would not have caught it: the images
  # were complete for weeks until this workflow deleted their children.
  verify-ghcr:
    needs: cleanup-ghcr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every child manifest behind latest and each release tag answers 200
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 0.8 … 0.10.2 lost their children on GHCR before this check existed
          # and were never republished (Docker Hub and Quay.io still have them).
          # Releases from here on must stay complete.
          FIRST_CHECKED: 0.10.3
        run: |
          set -euo pipefail
          REPO=jp1337/momo
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:${REPO}:pull&service=ghcr.io" | jq -r .token)
          status() {
            curl -s -o "${2:-/dev/null}" -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${ACCEPT}" \
              "https://ghcr.io/v2/${REPO}/manifests/$1"
          }

          # Each release vX.Y.Z publishes X.Y.Z and X.Y (build-and-publish.yml).
          # Assigned first so a failing API call stops the job instead of
          # leaving only `latest` to check.
          GIT_TAGS=$(gh api --paginate "repos/${REPO}/tags" --jq '.[].name')
          TAGS=(latest)
          for v in $(sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' <<<"$GIT_TAGS"); do
            if [ "$(printf '%s\n%s\n' "$FIRST_CHECKED" "$v" | sort -V | head -n1)" = "$FIRST_CHECKED" ]; then
              TAGS+=("$v" "${v%.*}")
            fi
          done
          [ "${#TAGS[@]}" -gt 1 ] || { echo "::error::no release tag >= ${FIRST_CHECKED} found"; exit 1; }

          BROKEN=0
          for tag in $(printf '%s\n' "${TAGS[@]}" | sort -u); do
            code=$(status "$tag" index.json)
            if [ "$code" != 200 ]; then
              echo "::error::${tag}: index ${code}"; BROKEN=1; continue
            fi
            line="${tag}: index 200"
            for d in $(jq -r '.manifests[]?.digest' index.json); do
              c=$(status "$d")
              line="${line}, ${d:7:12} ${c}"
              [ "$c" = 200 ] || { echo "::error::${tag}: child ${d} answers ${c}"; BROKEN=1; }
            done
            echo "$line"
          done
          exit "$BROKEN"

  # ── Docker Hub + Quay.io ──────────────────────────────────────────────────
  # List all sha- tags sorted newest-first, skip the first 10, delete the rest.
  cleanup-registries:
    runs-on: ubuntu-latest
    permissions: {}  # only talks to external Docker Hub + Quay.io APIs
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
    steps:
      - name: Delete old sha- tags from Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        run: |
          set -euo pipefail
          KEEP=10

          API_TOKEN=$(curl -sf -X POST \
            "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"'"${DOCKERHUB_USERNAME}"'","password":"'"${DOCKERHUB_TOKEN}"'"}' \
            | jq -r '.token')

          # Collect all sha- tags sorted newest-first (API returns by last_updated desc)
          SHA_TAGS=()
          PAGE=1
          while true; do
            RESP=$(curl -sf \
              "https://hub.docker.com/v2/repositories/kermit1337/momo/tags?page_size=100&page=${PAGE}&ordering=last_updated" \
              -H "Authorization: Bearer ${API_TOKEN}")
            mapfile -t PAGE_TAGS < <(echo "${RESP}" | jq -r '.results[].name | select(startswith("sha-"))')
            SHA_TAGS+=("${PAGE_TAGS[@]}")
            [[ $(echo "${RESP}" | jq -r '.next') == "null" ]] && break
            PAGE=$((PAGE + 1))
          done

          DELETED=0
          for i in "${!SHA_TAGS[@]}"; do
            [[ $i -lt $KEEP ]] && continue
            tag="${SHA_TAGS[$i]}"
            if curl -sf -X DELETE \
              "https://hub.docker.com/v2/repositories/kermit1337/momo/tags/${tag}/" \
              -H "Authorization: Bearer ${API_TOKEN}"; then
              echo "Deleted Docker Hub: ${tag}"
              DELETED=$((DELETED + 1))
            else
              echo "Failed to delete Docker Hub: ${tag}" >&2
            fi
          done
          echo "Docker Hub: kept ${KEEP}, deleted ${DELETED} sha- tag(s)."

      - name: Delete old sha- tags from Quay.io
        if: env.QUAY_TOKEN != ''
        run: |
          set -euo pipefail
          KEEP=10

          # Use the Quay.io REST API with Basic auth only for listing (read-only).
          # Quay.io blocks Basic auth + CSRF-free DELETE via REST API for robot accounts.
          # Deletion is done via skopeo (registry protocol) which avoids CSRF entirely
          # and works with the same robot account credentials as docker login.
          QUAY_BASIC=$(echo -n "${QUAY_USERNAME}:${QUAY_TOKEN}" | base64 -w 0)

          # Collect all sha- tags sorted newest-first (has_additional pagination)
          SHA_TAGS=()
          PAGE=1
          while true; do
            RESP=$(curl -sf \
              "https://quay.io/api/v1/repository/jp1337/momo/tag/?limit=100&page=${PAGE}&onlyActiveTags=true" \
              -H "Authorization: Basic ${QUAY_BASIC}")
            mapfile -t PAGE_TAGS < <(echo "${RESP}" | jq -r '.tags[].name | select(startswith("sha-"))')
            SHA_TAGS+=("${PAGE_TAGS[@]}")
            [[ $(echo "${RESP}" | jq -r '.has_additional') != "true" ]] && break
            PAGE=$((PAGE + 1))
          done

          DELETED=0
          for i in "${!SHA_TAGS[@]}"; do
            [[ $i -lt $KEEP ]] && continue
            tag="${SHA_TAGS[$i]}"
            if skopeo delete \
              --creds "${QUAY_USERNAME}:${QUAY_TOKEN}" \
              "docker://quay.io/jp1337/momo:${tag}"; then
              echo "Deleted Quay.io: ${tag}"
              DELETED=$((DELETED + 1))
            else
              echo "Failed to delete Quay.io: ${tag}" >&2
            fi
          done
          echo "Quay.io: kept ${KEEP}, deleted ${DELETED} sha- tag(s)."
